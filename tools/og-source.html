<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #F8F6F0;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #232A22;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 84px;
  }
  .grid { position: absolute; inset: 0; opacity: .45; }
  .dial {
    position: absolute;
    right: -170px; top: 50%;
    width: 700px; height: 700px;
    margin-top: -350px;
    opacity: .55;
  }
  .copy { position: relative; max-width: 720px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .wordmark { font-family: 'Marcellus', serif; font-size: 34px; letter-spacing: .01em; }
  .wordmark em { font-style: normal; color: #7A9E7E; }
  h1 {
    font-family: 'Marcellus', serif;
    font-weight: 400;
    font-size: 86px;
    line-height: 1.02;
    letter-spacing: -.01em;
  }
  h1 em { font-style: normal; color: #7A9E7E; }
  p { font-size: 24px; line-height: 1.5; color: #4B5347; margin-top: 26px; max-width: 560px; }
  .meta {
    display: flex; align-items: center; gap: 20px;
    margin-top: 42px;
    font-family: 'DM Mono', monospace;
    font-size: 15px; letter-spacing: .08em;
    color: #6B7064;
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #C9A227; }
  .rule { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #C9A227; }
</style>
</head>
<body>
  <div class="rule"></div>

  <svg class="grid" viewBox="0 0 1200 630" preserveAspectRatio="none">
    <g stroke="#D3D6C9" stroke-width="1">
      <line x1="0" y1="157" x2="1200" y2="157"/>
      <line x1="0" y1="315" x2="1200" y2="315"/>
      <line x1="0" y1="472" x2="1200" y2="472"/>
      <line x1="300" y1="0" x2="300" y2="630"/>
      <line x1="600" y1="0" x2="600" y2="630"/>
      <line x1="900" y1="0" x2="900" y2="630"/>
    </g>
  </svg>

  <svg class="dial" viewBox="-110 -110 220 220">
    <circle r="104" fill="none" stroke="#D3D6C9" stroke-width=".7"/>
    <circle r="86" fill="none" stroke="#C4D0BE" stroke-width=".5"/>
    <circle r="58" fill="none" stroke="#D3D6C9" stroke-width=".4" stroke-dasharray="2 3"/>
    <g id="ticks"></g>
    <path d="M0 -74 L11 -34 L0 -42 L-11 -34 Z" fill="#7A9E7E"/>
    <circle r="7" fill="#C9A227"/>
  </svg>

  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="44" height="44">
        <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#7A9E7E" stroke-width="1.4"/>
        <g stroke="#7A9E7E" stroke-width=".8" opacity=".55">
          <line x1="14" y1="2" x2="14" y2="38"/><line x1="26" y1="2" x2="26" y2="38"/>
          <line x1="2" y1="14" x2="38" y2="14"/><line x1="2" y1="26" x2="38" y2="26"/>
        </g>
        <path d="M20 5 L23.4 15.6 L20 13.4 L16.6 15.6 Z" fill="#7A9E7E"/>
        <circle cx="20" cy="20" r="2.6" fill="#C9A227"/>
      </svg>
      <span class="wordmark">Vastu<em>First</em></span>
    </div>

    <h1>India&rsquo;s No. 1<br><em>Vastu</em> App</h1>
    <p>A room-by-room vastu verdict on your floor plan — before a single brick is laid.</p>

    <div class="meta">
      <span>81-PADA GRID</span><span class="dot"></span>
      <span>EVERY RULE SOURCED</span><span class="dot"></span>
      <span>NO SIGN-UP</span>
    </div>
  </div>

<script>
  // Same 48-tick geometry as the site's compass dial.
  const g = document.getElementById('ticks');
  for (let i = 0; i < 48; i++) {
    const a = (i * 7.5 - 90) * Math.PI / 180;
    const major = i % 12 === 0, mid = i % 6 === 0;
    const r2 = major ? 88 : (mid ? 92 : 96);
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', (Math.cos(a) * 100).toFixed(2));
    l.setAttribute('y1', (Math.sin(a) * 100).toFixed(2));
    l.setAttribute('x2', (Math.cos(a) * r2).toFixed(2));
    l.setAttribute('y2', (Math.sin(a) * r2).toFixed(2));
    l.setAttribute('stroke', major ? '#7A9E7E' : '#C4D0BE');
    l.setAttribute('stroke-width', major ? 1.6 : 0.7);
    g.appendChild(l);
  }
</script>
</body>
</html>
